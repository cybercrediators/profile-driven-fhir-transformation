[pytest]
# Pytest configuration for FSH-NiFi Bridge

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 3.10

# Add project root to Python path for imports
pythonpath = . src

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external services)
    slow: Tests that take significant time to run
    requires_valkey: Tests requiring Valkey cache connection
    requires_matchbox: Tests requiring Matchbox FHIR server
    requires_network: Tests requiring network connectivity

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */testing.py
    */__pycache__/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
